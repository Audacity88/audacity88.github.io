name: Deploy portfolio to GitHub Pages

# Pages is not enabled for this portfolio. Push triggers are intentionally off
# until Dan approves publishing. Run manually only after publication approval
# and separate Pages setup in repository settings.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Install dependencies
        run: npm ci
      - name: Check and build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
